name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/captcha-forge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish_without_environment:
    # A trusted publisher registered on PyPI without an environment name does
    # not match the job above, so retry the upload without an environment.
    name: Publish to PyPI (publisher without environment)
    needs: [build, publish]
    if: ${{ always() && needs.publish.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  report:
    name: Publish result
    needs: [publish, publish_without_environment]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        env:
          WITH_ENVIRONMENT: ${{ needs.publish.result }}
          WITHOUT_ENVIRONMENT: ${{ needs.publish_without_environment.result }}
        run: |
          if [ "$WITH_ENVIRONMENT" = "success" ] || [ "$WITHOUT_ENVIRONMENT" = "success" ]; then
            echo "The distributions were uploaded to PyPI."
            exit 0
          fi
          echo "Nothing was uploaded to PyPI."
          echo "Register a trusted publisher on https://pypi.org/manage/account/publishing/ for"
          echo "project captcha-forge, owner shalonjovan, repository shalonjovan/Captcha,"
          echo "workflow publish.yml (environment name: pypi), or add a PYPI_API_TOKEN secret"
          echo "and run the 'Publish (API token)' workflow."
          exit 1
