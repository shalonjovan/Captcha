site_name: Captcha Forge
site_description: A modern, extensible CAPTCHA generator for Python.
site_url: https://shalonjovan.github.io/Captcha/
repo_url: https://github.com/shalonjovan/Captcha
repo_name: shalonjovan/Captcha
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/shield-check
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Challenge types: captcha-types.md
  - Configuration: configuration.md
  - CLI: cli.md
  - Recipes: recipes.md
  - Extending: extending.md
  - API reference: api.md
  - Security: security.md
  - Changelog: changelog.md
  - Contributing: contributing.md
